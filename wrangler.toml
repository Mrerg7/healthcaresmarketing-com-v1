# Cloudflare Workers + Static Assets
name = "healthcaresmarketing-com-v1"
main = "./src/worker.ts"
compatibility_date = "2026-08-11"
# Avoid a second indexable host (*.workers.dev)
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
# Worker runs first so www → apex 301 always applies
run_worker_first = true
# Serve custom 404.html with a real 404 status (avoids soft 404 / blank errors)
not_found_handling = "404-page"
# Disable Cloudflare HTML redirects (/index.html→/, /404.html→/404) that
# Search Console reports as "Page with redirect". The Worker serves "/" from
# index.html and returns a real 404 for the 404 document paths.
html_handling = "none"

[[routes]]
pattern = "healthcaresmarketing.com"
custom_domain = true

[[routes]]
pattern = "www.healthcaresmarketing.com"
custom_domain = true
